<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija - RhytmPulse</title>
    <link rel="stylesheet" href="registracija.css">
</head>
<body>
     <!-- header -->
    <header>
    <h2>
        <a href="pagrindinis.html">Rhythm Pulse</a>
    </h2>

    <ul>
            <li><a href="apie.html">Apie</a></li>
            <li><a href="contacts.html">Kontaktai</a></li>
            <li><a href="galerija.html">Galerija</a></li>
            <li><a href="registracija.html">Uzsakymas</a></li>
    </ul>
    </header>

        <main class="registration-page">
            <div class="registration-card">
                <img class="registration-card__image" src="img/Dance.jpg" alt="breakdance">
                
                <div class="registration-card__content">
                    <div class="registration-card__header">
                        <h2 class="registration-card__title">Registration</h2>
                    </div>
                    
                    <div class="registration-card__form-wrapper">   
                        <form class="form">

                            <label class="form__label" for="fname">Full name:</label><br>
                            <input class="form__input" type="text" id="fname" name="fname"><br>

                            <label class="form__label" for="lname">Date of birth:</label><br>
                            <input class="form__input" type="date" id="date" name="date"><br>

                            <label class="form__label" for="styles">Choose your style</label><br>
                            <input class="form__input" type="text" id="styles" name="styles"><br>
                            
                            <label class="form__label" for="email">Email</label><br>
                            <input class="form__input" type="email" id="email" name="email"><br>

                            <label class="form__label" for="phone">Phone</label><br>
                            <input class="form__input" type="tel" id="phone" name="phone"><br>

                            <input class="form__submit" type="submit" value="Submit">

                        </form>
                    </div>
                </div>

            </div>    
        </main>
</body>

</html>
